<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>请在浏览器中打开</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
      --card: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 80% -10%, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: var(--fg);
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .wrap {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 8px 0; line-height: 1.6; }
    .steps {
      margin-top: 14px;
      padding-left: 0;
      list-style: none;
    }
    .steps li {
      margin: 10px 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px dashed rgba(255,255,255,0.16);
    }
    .tip {
      margin-top: 16px;
      color: #cbd5f5;
      font-size: 13px;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2,6,23,0.88);
      display: none;
      z-index: 9999;
    }
    .overlay.show { display: block; }
    .hand {
      position: absolute;
      top: 12px;
      right: 10px;
      color: #fff;
      font-size: 14px;
      text-align: right;
      width: 160px;
    }
    .arrow {
      position: absolute;
      top: 46px;
      right: 18px;
      width: 64px;
      height: 64px;
      border: 2px solid #fff;
      border-color: transparent #fff #fff transparent;
      transform: rotate(-45deg);
      border-radius: 6px;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.3; transform: rotate(-45deg) scale(0.9); }
      50% { opacity: 1; transform: rotate(-45deg) scale(1.05); }
      100% { opacity: 0.3; transform: rotate(-45deg) scale(0.9); }
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(56,189,248,0.2);
      color: var(--accent);
      font-size: 12px;
      margin-left: 6px;
      border: 1px solid rgba(56,189,248,0.35);
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 10px;
      background: #38bdf8;
      color: #0b1220;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .btn:active { transform: translateY(1px); }
    .countdown {
      margin-top: 10px;
      font-size: 13px;
      color: #cbd5f5;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>请在浏览器中打开<span class="badge">微信限制</span></h1>
    <p id="status">检测中...</p>

    <div id="wechat-guide" style="display:none;">
      <p>检测到你正在微信内打开，本页面在微信中可能被拦截。</p>
      <p>请按照下面步骤使用系统浏览器访问：</p>
      <ul class="steps">
        <li>1. 点击右上角“⋯”更多</li>
        <li>2. 选择“在浏览器中打开”</li>
      </ul>
      <button class="btn" id="copy-btn">复制链接</button>
      <p class="tip" id="copy-tip">如果看不到“在浏览器中打开”，请选择“复制链接”，再粘贴到浏览器访问。</p>
    </div>

    <div id="browser-tip" style="display:none;">
      <p>将为你自动跳转到落地页。</p>
      <div class="countdown">倒计时 <span id="seconds">2</span> 秒…</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="hand">点击右上角“⋯”<br/>选择浏览器打开</div>
    <div class="arrow"></div>
  </div>

  <script>
    (function () {
      var targetUrl = "https://onearths.shop/oeckn7/3sEspcwvpjNgQlIKnhDWwm";
      var ua = navigator.userAgent.toLowerCase();
      var isWeChat = ua.indexOf("micromessenger") !== -1;

      var overlay = document.getElementById("overlay");
      var statusEl = document.getElementById("status");
      var wechatGuide = document.getElementById("wechat-guide");
      var browserTip = document.getElementById("browser-tip");
      var secondsEl = document.getElementById("seconds");
      var copyBtn = document.getElementById("copy-btn");
      var copyTip = document.getElementById("copy-tip");

      if (isWeChat) {
        statusEl.textContent = "请在浏览器中打开";
        wechatGuide.style.display = "block";
        overlay.classList.add("show");

        copyBtn.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(targetUrl).then(function () {
              copyTip.textContent = "链接已复制，请粘贴到浏览器打开。";
            }).catch(function () {
              copyTip.textContent = "复制失败，请手动长按复制链接。";
            });
          } else {
            copyTip.textContent = "当前环境不支持一键复制，请手动长按复制链接。";
          }
        });
      } else {
        statusEl.textContent = "正在跳转…";
        browserTip.style.display = "block";

        var remaining = 2;
        var timer = setInterval(function () {
          remaining -= 1;
          secondsEl.textContent = String(remaining);
          if (remaining <= 0) {
            clearInterval(timer);
            window.location.replace(targetUrl);
          }
        }, 1000);
      }
    })();
  </script>
</body>
</html>
